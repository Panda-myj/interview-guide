services:
  # =========================================
  # 1. PostgreSQL 数据库服务
  # -----------------------------------------
  # 作用：
  #   - 存储业务数据（用户、简历信息等）
  #   - 存储向量数据（基于 pgvector 插件），用于 RAG（检索增强生成）知识库检索
  #
  # 教程知识点：
  #   - 选用 pgvector/pgvector 镜像而不是标准的 postgres 镜像，是为了获得向量搜索能力。
  #   - 向量数据库是 LLM 应用开发中的核心基础设施。
  # =========================================
  postgres:
    # 使用带有 pgvector 插件的 PostgreSQL 16 镜像
    image: pgvector/pgvector:pg16
    container_name: interview-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: interview_guide
    volumes:
      # 数据持久化：确保容器重启或删除后，数据库数据不丢失
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本：容器首次启动时会自动执行 /docker-entrypoint-initdb.d/ 下的 .sql 文件
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    # 健康检查：
    # 后端服务(app)需要等待数据库完全启动并准备好连接后才能启动。
    # 这里通过 pg_isready 命令检测数据库状态。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================
  # 2. Redis 缓存与消息队列服务
  # -----------------------------------------
  # 作用：
  #   - 缓存：存储 Session、临时数据，提升系统性能
  #   - 消息队列：利用 Redis Stream 实现异步任务处理（如简历分析、文档向量化）
  #
  # 教程知识点：
  #   - 在轻量级架构中，Redis Stream 是 Kafka/RabbitMQ 的优秀替代方案，运维成本更低。
  # =========================================
  redis:
    image: redis:7
    container_name: interview-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =========================================
  # 3. RustFS 对象存储服务（S3 兼容）
  # -----------------------------------------
  # 作用：
  #   - 存储非结构化数据：用户上传的简历(PDF/Word)、头像、知识库文档等
  #
  # 为什么不再是 MinIO：
  #   - MinIO 社区版自 2025-10 起停止发布免费 Docker 镜像，Docker Hub 上的
  #     minio/minio、minio/mc 仓库已下线，继续引用只会得到
  #     "pull access denied ... repository does not exist"，docker login 无法解决。
  #   - 本项目开发依赖（docker-compose.dev.yml）已使用 RustFS，S3 API 兼容；
  #     应用侧 S3Config 使用 forcePathStyle，无需改动代码。
  #
  # 教程知识点：
  #   - 9000 是 S3 API 端口；Web 控制台 9001 在生产关闭，不对外暴露。
  #   - RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY 是对象存储根凭据，也是 app 的 S3 凭据；
  #     .env 中必须提供，缺失时 compose 在插值阶段直接报错。
  # =========================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: interview-rustfs
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY_is_required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY_is_required}
      # 生产不启动 Web 控制台，缩小攻击面；开发模式由 docker-compose.dev.yml 单独开启
      RUSTFS_CONSOLE_ENABLE: "false"
    networks:
      default:
        # 兼容存量部署中 APP_STORAGE_ENDPOINT=http://minio:9000 的写法；新配置请用 rustfs
        aliases:
          - minio
    ports:
      # 只绑定回环地址供本机排障；真正部署到公网时请删除这一行
      - "127.0.0.1:9000:9000"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -s -o /dev/null -w '%{http_code}' http://localhost:9000/minio/health/live | grep -E '^(200|403)$'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # =========================================
  # 4. 对象存储初始化任务 (Init Container Pattern)
  # -----------------------------------------
  # 作用：
  #   - 幂等创建 APP_STORAGE_BUCKET 指定的 Bucket，并确认匿名访问被拒绝
  #
  # 为什么不再用 minio/mc：
  #   - minio/mc 镜像同样已下线；而生产 profile 明确禁止应用启动时自动建桶
  #     （application-prod.yml: app.storage.auto-create-bucket=false）。
  #   - RustFS 镜像自带 curl 8.x，支持 --aws-sigv4，可直接发签名 PUT /{bucket}
  #     完成建桶，不需要再拉取任何第三方镜像。
  # =========================================
  storage-init:
    image: rustfs/rustfs:latest
    container_name: interview-storage-init
    depends_on:
      rustfs:
        condition: service_healthy # 必须等待对象存储健康（不仅仅是启动）
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${APP_STORAGE_REGION:-us-east-1}
      S3_BUCKET: ${APP_STORAGE_BUCKET:-interview-guide}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY_is_required}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY_is_required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        sig="aws:amz:$${S3_REGION}:s3"
        url="$${S3_ENDPOINT}/$${S3_BUCKET}"
        cred="$${S3_ACCESS_KEY}:$${S3_SECRET_KEY}"

        status=$$(curl -sS --connect-timeout 3 --max-time 15 -o /dev/null -w '%{http_code}' \
          -I --aws-sigv4 "$${sig}" --user "$${cred}" "$${url}" || echo 000)
        if [ "$${status}" = "403" ]; then
          echo "[storage-init] credentials rejected by object storage" >&2
          exit 1
        fi
        if [ "$${status}" = "200" ]; then
          echo "[storage-init] bucket '$${S3_BUCKET}' already exists"
        else
          echo "[storage-init] creating bucket '$${S3_BUCKET}' (HEAD=$${status})"
          curl -sS --fail-with-body --connect-timeout 3 --max-time 15 -X PUT \
            --aws-sigv4 "$${sig}" --user "$${cred}" "$${url}" > /dev/null
        fi

        verify=$$(curl -sS --connect-timeout 3 --max-time 15 -o /dev/null -w '%{http_code}' \
          -I --aws-sigv4 "$${sig}" --user "$${cred}" "$${url}" || echo 000)
        if [ "$${verify}" != "200" ]; then
          echo "[storage-init] bucket verification failed (HEAD=$${verify})" >&2
          exit 1
        fi
        anon=$$(curl -sS --connect-timeout 3 --max-time 15 -o /dev/null -w '%{http_code}' \
          -I "$${url}" || echo 000)
        if [ "$${anon}" = "200" ]; then
          echo "[storage-init] bucket is publicly readable; refusing to continue" >&2
          exit 1
        fi
        echo "[storage-init] bucket '$${S3_BUCKET}' ready (anonymous HEAD=$${anon})"

  # =========================================
  # 5. 后端应用服务 (Spring Boot)
  # -----------------------------------------
  # 作用：
  #   - 提供 RESTful API
  #   - 处理核心业务逻辑（简历分析、模拟面试、RAG）
  # =========================================
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: interview-app
    # 依赖管理：确保基础设施准备好后再启动后端
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully # 等待初始化任务完成
    environment:
      # === 运行环境 ===
      # 默认以生产模式运行（加载 application-prod.yml）。
      # 本地全栈调试若想沿用开发默认行为，可设置 SPRING_PROFILES_ACTIVE=dev
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # === 数据库连接 ===
      # 使用服务名 'postgres' 作为主机名，Docker 内部 DNS 会自动解析
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: interview_guide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      
      # === Redis 连接 ===
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # === 对象存储配置 ===
      # 后端在容器内访问 RustFS（S3 兼容），使用服务名 rustfs 做 DNS
      APP_STORAGE_ENDPOINT: http://rustfs:9000
      APP_STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY_is_required}
      APP_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY_is_required}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-interview-guide}
      APP_STORAGE_REGION: ${APP_STORAGE_REGION:-us-east-1}
      
      # === AI 模型配置 (必须配置) ===
      # 这里的变量值来自宿主机的环境变量或 .env 文件
      PROVIDER_DASHSCOPE_API_KEY: ${PROVIDER_DASHSCOPE_API_KEY}
      PROVIDER_DASHSCOPE_MODEL: ${PROVIDER_DASHSCOPE_MODEL:-qwen3.5-flash}
      APP_AI_CONFIG_ENCRYPTION_KEY: ${APP_AI_CONFIG_ENCRYPTION_KEY}

      # === 用户认证与短信 ===
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      APP_AUTH_BOOTSTRAP_PHONE: ${APP_AUTH_BOOTSTRAP_PHONE:?APP_AUTH_BOOTSTRAP_PHONE is required}
      APP_AUTH_SMS_PROVIDER: ${APP_AUTH_SMS_PROVIDER:?APP_AUTH_SMS_PROVIDER is required}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_LOGIN_CODE_TEMPLATE: ${ALIYUN_SMS_LOGIN_CODE_TEMPLATE:-}
      # PNVS（号码认证）凭据：.env 里 APP_AUTH_SMS_PROVIDER=pnvs 时必须传入，
      # 否则 AuthBootstrapValidator 判定"PNVS 短信认证配置不完整"并拒绝启动。
      # 注意 .env 不会自动注入容器，每一行都必须在这里显式声明。
      ALIYUN_PNVS_ACCESS_KEY_ID: ${ALIYUN_PNVS_ACCESS_KEY_ID:-}
      ALIYUN_PNVS_ACCESS_KEY_SECRET: ${ALIYUN_PNVS_ACCESS_KEY_SECRET:-}
      ALIYUN_PNVS_SIGN_NAME: ${ALIYUN_PNVS_SIGN_NAME:-}
      ALIYUN_PNVS_TEMPLATE_CODE: ${ALIYUN_PNVS_TEMPLATE_CODE:-}
      ALIYUN_PNVS_SCHEME_NAME: ${ALIYUN_PNVS_SCHEME_NAME:-}

      # === 面试参数配置 ===
      APP_INTERVIEW_FOLLOW_UP_COUNT: ${APP_INTERVIEW_FOLLOW_UP_COUNT:-1}
      APP_INTERVIEW_EVALUATION_BATCH_SIZE: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:-8}

      # === 生产 Profile 可调项（详见 application-prod.yml）===
      # 业务表由 Flyway 迁移脚本管理，JPA 只做校验。
      # 空库首次部署时 vector_store 表由 Spring AI 以 CREATE IF NOT EXISTS 方式补齐；
      # 建表完成后可显式设置 PGVECTOR_INIT_SCHEMA=false。此处默认值需与 application-prod.yml 一致。
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      PGVECTOR_INIT_SCHEMA: ${PGVECTOR_INIT_SCHEMA:-true}
      # CORS 白名单：生产请改成真实访问域名，多个用英文逗号分隔
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      # 文件日志路径（容器内，挂载 app_logs 卷持久化）
      LOG_FILE: ${LOG_FILE:-logs/app.log}
    volumes:
      # 持久化应用日志（容器内 /app/logs 对应 application-prod.yml 的 logging.file.name）
      - app_logs:/app/logs
    ports:
      - "8080:8080"

  # =========================================
  # 6. 前端应用服务 (Vue/React + Nginx)
  # -----------------------------------------
  # 作用：
  #   - 提供用户界面
  #   - 反向代理 API 请求（通常在 Nginx 配置中处理）
  # =========================================
  frontend:
    build: ./frontend
    container_name: interview-frontend
    depends_on:
      - app
    ports:
      - "80:80"

# =========================================
# 定义 Docker 卷 (Volumes)
# -----------------------------------------
# 作用：声明命名卷，用于数据持久化。
# 即使删除了容器 (docker-compose down)，这些卷中的数据依然存在。
# =========================================
volumes:
  postgres_data:
  redis_data:
  # 生产与开发（docker-compose.dev.yml 的 rustfs_data）使用不同卷，避免互相污染
  object_storage_data:
  app_logs:
